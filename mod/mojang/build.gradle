import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

def fetchJson(String url) {
    def conn = URI.create(url).toURL().openConnection()
    conn.setRequestProperty('User-Agent', 'oneonly/void-client-build')
    conn.connectTimeout = 20000
    conn.readTimeout = 60000
    return new JsonSlurper().parse(conn.inputStream)
}

def enc(String s) { URLEncoder.encode(s, 'UTF-8') }

def mc = project.property('minecraft_version') as String
def javaVer = (project.property('java_version') as String) as int
def loaderVersion = fetchJson('https://meta.fabricmc.net/v2/versions/loader').find { it.stable }.version
def apiVersions = fetchJson("https://api.modrinth.com/v2/project/fabric-api/version?game_versions=${enc('["' + mc + '"]')}&loaders=${enc('["fabric"]')}")
if (apiVersions.isEmpty()) throw new GradleException("Brak Fabric API dla ${mc}")
def apiVersion = apiVersions[0].version_number
logger.lifecycle("Void Client ${mc}: loader ${loaderVersion}, fabric-api ${apiVersion}")

version = mc
group = 'dev.oneonly'
base { archivesName = 'voidclient' }

sourceSets {
    main {
        java { srcDirs = ["${rootDir}/../core", "${rootDir}/src"] }
        resources { srcDirs = ["${rootDir}/template", "${rootDir}/../resources"] }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
}

processResources {
    def props = [version: mc, mc_range: project.property('mc_range'), java: javaVer, entry: 'dev.oneonly.voidclient.mojang.VoidClientMod', author: '1nonly \$']
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVer
    it.options.encoding = 'UTF-8'
}
